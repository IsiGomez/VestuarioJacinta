<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="assets/style.css">
    </head>

    <body>
        <header>
            <nav>
                <div class="logo">
                    <a href="/" aria-label="Página de inicio">
                        <img src="assets/img/Jacinta.svg" alt="Inicio" width="160" height="100">
                    </a>
                </div>
                <ul>
                    <li class="nav-item">
                        <a href="#">
                            Cátalogo
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#">
                            Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#">
                            Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#">
                            Carrito de compras
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="login.html">
                        Iniciar Sesión
                        </a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="form">
                <article id="secc-log" class="secc-form">
                    <h2>Iniciar Sesión</h2>

                    <div class="grupo-form">
                        <label for="log-email">Correo electrónico</label>
                        <input type="email" id="log-email" name="email" placeholder="ejemplo@correo.com" autocomplete="email" maxlength="100" required>
                        <span class="error-msg" id="error-log-email"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="log-email">Contraseña</label>
                        <input type="password" id="log-pass" name="password" placeholder="••••" autocomplete="current-password" minlength="4" maxlength="10" required>
                        <span class="error-msg" id="error-log-pass"></span>
                    </div>

                    <button type="submit" class="submit-btn">Iniciar Sesión</button>

                    <p class="texto-login">
                        ¿Todavía no tienes una cuenta?
                        <a href="#" id="link-registro">Registrarme</a>
                    </p>
                </article>

                <article id="secc-reg" class="secc-form oculto">
                    <h2>Registrarse</h2>

                    <div>
                        <label for="reg-run">Run</label>
                        <input type="text" id="reg-run" name="run" placeholder="12345678K" minlength="7" maxlength="9" required>
                        <span class="error-msg" id="error-reg-run"></span>
                    </div>

                    <div>
                        <label for="reg-nom">Nombre</label>
                        <input type="text" id="reg-nom" name="nombre" placeholder="Ej: Julio Antonio" maxlength="50" required>
                        <span class="error-msg" id="error-reg-nom"></span>
                    </div>
                    
                    <div>
                        <label for="reg-apll">Apellidos</label>
                        <input type="text" id="reg-apll" name="apellido" placeholder="Ej: Peréz Soto" maxlength="100" required>
                        <span class="error-msg" id="error-reg-apll"></span>
                    </div>
                    
                    
                    <div>
                        <label for="reg-email">Correo electrónico</label>
                        <input type="email" name="email" id="reg-email" placeholder="ejemplo@correo.com" autocomplete="email" required>
                        <span class="error-msg" id="error-reg-email"></span>
                    </div>
                    
                    <div>
                        <label for="reg-date">Fecha de Nacimiento (opcional)</label>
                        <input type="date" id="reg-date" name="date" min="1926-01-01">
                        <span class="error-msg" id="error-reg-date"></span>
                    </div>

                    <button type="submit" class="submit-btn">Registrarme</button>

                    <p class="texto-registro">
                        ¿Ya tienes una cuenta?
                        <a href="#" id="link-login">Iniciar Sesión</a>
                    </p>
                </article>
            </section>
        </main>

        <footer>

        </footer>
        <script src="scripts/login.js"></script>
    </body>
</html>
